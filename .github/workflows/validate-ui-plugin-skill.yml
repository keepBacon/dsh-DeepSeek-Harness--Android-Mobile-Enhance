name: Validate mobile settings plugin and Skill fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-ui-plugin-skill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-termux.sh
          node --check scripts/android-runtime-patch.mjs
          bash scripts/check-severe-fixes.sh
          bash scripts/check-high-fixes.sh
          bash scripts/check-remaining-fixes.sh
          bash scripts/check-koffi-prebuild-fix.sh
          bash scripts/check-fs-search-fix.sh

      - name: Kotlin compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

# rerun: regression-anchor-fix

name: Import DSH Mobile V0.1 source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .source-sync/part00
            cat .source-sync/part01
            cat .source-sync/part02
            cat .source-sync/part03
            cat .source-sync/part04
            cat .source-sync/part05
            cat .source-sync/part06
            cat .source-sync/part07
            cat .source-sync/part08
            cat .source-sync/part09
            cat .source-sync/part10
            cat .source-sync/part11a
            cat .source-sync/p11_1
            cat .source-sync/p11_2
            cat .source-sync/p11_3
            cat .source-sync/part12
            cat .source-sync/part13
            cat .source-sync/p14_0
            cat .source-sync/p14_1
            cat .source-sync/p14_2
            cat .source-sync/p14_3
          } > /tmp/source.b64

          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "46ae1e1777383572ca1cc1d4dcb6548257faa5c433d022164ffcfc75d1a01e1a  /tmp/source.zip" | sha256sum --check

          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/source.zip -d /tmp/import
          test -f /tmp/import/dsh-mobile-v0.1/README.md
          test -f /tmp/import/dsh-mobile-v0.1/build-termux.sh
          test -f /tmp/import/dsh-mobile-v0.1/settings.gradle.kts
          test -d /tmp/import/dsh-mobile-v0.1/app
          test -d /tmp/import/dsh-mobile-v0.1/scripts

      - name: Import source into repository root
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/import/dsh-mobile-v0.1/. .
          rm -rf .source-sync

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Import DSH Mobile V0.1 source"
          git push origin HEAD:main

# source-sync trigger 2

name: Apply plugin boot recovery fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/plugin-boot-recovery.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/apply_plugin_recovery.py

      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-termux.sh
          node --check scripts/android-runtime-patch.mjs
          bash scripts/check-severe-fixes.sh
          bash scripts/check-high-fixes.sh
          bash scripts/check-remaining-fixes.sh
          bash scripts/check-koffi-prebuild-fix.sh
          bash scripts/check-fs-search-fix.sh

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply_plugin_recovery.py .github/workflows/plugin-boot-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent plugin failures from locking out DSH data"
          git push origin HEAD:main

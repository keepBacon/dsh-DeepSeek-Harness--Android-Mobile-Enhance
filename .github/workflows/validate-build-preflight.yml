name: Validate build preflight

on:
  push:
    branches: ["main", "fix/**", "feature/**"]
  pull_request:

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extended Termux tool catalog
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-termux-tool-catalog.sh --online

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -maxdepth 2 -type f -name '*.sh' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -maxdepth 1 -type f -name '*.mjs' -print0)
          node scripts/validate-desktop-web-parity.mjs --self-test
          node scripts/validate-agent-preset-parity.mjs --self-test

      - name: Build contract regression guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E 'ffmpeg["'\'' ]+--version|ffprobe["'\'' ]+--version|ffmpeg\|ffprobe.*--version' \
              scripts/embed-termux-tools.sh scripts/dsh-mobile-toolbox-mcp.mjs scripts/dsh-basic-toolbox-mcp.mjs; then
            echo 'Invalid ffmpeg/ffprobe --version usage detected.' >&2
            exit 1
          fi
          grep -Fq 'dsh_run_tool_smoke()' scripts/embed-termux-tools.sh
          grep -Fq 'dsh_tool_spec_for' scripts/embed-termux-tools.sh
          grep -Fq 'dash-version)' scripts/embed-termux-tools.sh
          grep -Fq 'DSH_TERMUX_REQUIRED_TOOL_SPECS' scripts/embed-termux-tools.sh

      - name: Smoke dispatcher argument contract
        shell: bash
        run: |
          set -euo pipefail
          source scripts/dsh-termux-tool-catalog.sh
          source scripts/embed-termux-tools.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mock="$tmp/mock"
          cat >"$mock" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*"
          EOF
          chmod +x "$mock"

          check() {
            local tool="$1" expected="$2"
            local log="$tmp/$tool.log"
            dsh_run_tool_smoke "$tool" "$mock" "$log"
            grep -Fxq -- "$expected" "$log"
          }

          check ffmpeg -version
          check ffprobe -version
          check magick -version
          check adb version
          check aapt2 version
          check sqlite3 --version
          check yq --version
          check cmake --version
          check ninja --version
          check ss -V
          check dig -v
          check pdfinfo -v
          check 7z i
          check clang --version
          check tmux -V
          check git-lfs version
          check ffmpeg -version
          check exiftool -ver

      - name: Termux generated-entrypoint staging contract
        shell: bash
        run: |
          set -euo pipefail
          source scripts/dsh-termux-tool-catalog.sh
          source scripts/embed-termux-tools.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fake_prefix="$tmp/host/usr"
          stage="$tmp/stage"
          mkdir -p "$fake_prefix/bin" "$stage/usr/bin" "$stage/usr/lib"
          # Case 1: direct executable (zip/unzip/http-style entrypoint).
          cat >"$fake_prefix/bin/direct-tool" <<'EOF'
          #!/usr/bin/env bash
          printf 'direct-tool\n'
          EOF
          chmod +x "$fake_prefix/bin/direct-tool"
          PREFIX="$fake_prefix" dsh_materialize_host_entrypoint "$stage" direct-tool 0
          test ! -L "$stage/usr/bin/direct-tool"
          test -x "$stage/usr/bin/direct-tool"
          test "$("$stage/usr/bin/direct-tool")" = "direct-tool"

          # Case 2: one-hop symlink.
          cat >"$fake_prefix/bin/one-hop-real" <<'EOF'
          #!/usr/bin/env bash
          printf 'one-hop\n'
          EOF
          chmod +x "$fake_prefix/bin/one-hop-real"
          ln -s one-hop-real "$fake_prefix/bin/one-hop"
          PREFIX="$fake_prefix" dsh_materialize_host_entrypoint "$stage" one-hop 0
          test -L "$stage/usr/bin/one-hop"
          test -x "$stage/usr/bin/one-hop"
          test "$(readlink "$stage/usr/bin/one-hop")" = "one-hop-real"
          test "$("$stage/usr/bin/one-hop")" = "one-hop"

          # Case 3: multi-hop alternatives chain (real Termux nc shape).
          mkdir -p "$fake_prefix/etc/alternatives"
          cat >"$fake_prefix/bin/netcat-openbsd" <<'EOF'
          #!/usr/bin/env bash
          printf 'netcat-openbsd\n'
          EOF
          chmod +x "$fake_prefix/bin/netcat-openbsd"
          ln -s ../etc/alternatives/nc "$fake_prefix/bin/nc"
          ln -s ../../bin/netcat-openbsd "$fake_prefix/etc/alternatives/nc"

          PREFIX="$fake_prefix" dsh_materialize_host_entrypoint "$stage" nc 0
          test -L "$stage/usr/bin/nc"
          test -x "$stage/usr/bin/nc"
          test -x "$stage/usr/bin/netcat-openbsd"
          test "$(readlink "$stage/usr/bin/nc")" = "netcat-openbsd"
          test "$("$stage/usr/bin/nc")" = "netcat-openbsd"

      - name: Metadata-less Python CLI import closure contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          prefix="$tmp/prefix"
          pyver="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          site="$prefix/lib/python$pyver/site-packages"
          mkdir -p "$prefix/bin" "$site/frida_tools" "$site/colorama"

          cat >"$prefix/bin/frida" <<'EOF_FRIDA'
          #!/usr/bin/env python3
          import frida_tools.repl
          EOF_FRIDA
          chmod +x "$prefix/bin/frida"

          cat >"$site/frida_tools/__init__.py" <<'EOF_FT_INIT'
          EOF_FT_INIT
          cat >"$site/frida_tools/repl.py" <<'EOF_FT_REPL'
          from colorama import Fore
          EOF_FT_REPL
          cat >"$site/colorama/__init__.py" <<'EOF_COLORAMA'
          Fore = object()
          EOF_COLORAMA

          out="$tmp/files.bin"
          PYTHONPATH="$site" python3 scripts/resolve-python-runtime-closure.py             --prefix "$prefix" frida >"$out"

          python3 - "$out" "$site" <<'PY_CHECK'
          import pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes().split(b"\0")
          paths = {p.decode() for p in raw if p}
          site = pathlib.Path(sys.argv[2])
          required = {
              str(site / "frida_tools/repl.py"),
              str(site / "colorama/__init__.py"),
          }
          missing = required - paths
          if missing:
              raise SystemExit("metadata-less import closure missing: " + ", ".join(sorted(missing)))
          PY_CHECK

      - name: Python CLI recursive dependency closure contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          prefix="$tmp/prefix"
          pyver="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          site="$prefix/lib/python$pyver/site-packages"
          mkdir -p "$prefix/bin" "$site/rootpkg" "$site/childpkg"                    "$site/rootpkg-1.0.dist-info" "$site/childpkg-2.0.dist-info"

          cat >"$prefix/bin/fakepy" <<'EOF_FAKEPY'
          #!/usr/bin/env python3
          import rootpkg
          print(rootpkg.VALUE)
          EOF_FAKEPY
          chmod +x "$prefix/bin/fakepy"

          cat >"$site/rootpkg/__init__.py" <<'EOF_ROOT'
          import childpkg
          VALUE = "root+" + childpkg.VALUE
          EOF_ROOT
          cat >"$site/childpkg/__init__.py" <<'EOF_CHILD'
          VALUE = "child"
          EOF_CHILD

          cat >"$site/rootpkg-1.0.dist-info/METADATA" <<'EOF_ROOT_META'
          Metadata-Version: 2.1
          Name: rootpkg
          Version: 1.0
          Requires-Dist: childpkg>=2
          EOF_ROOT_META
          cat >"$site/rootpkg-1.0.dist-info/entry_points.txt" <<'EOF_ROOT_EP'
          [console_scripts]
          fakepy = rootpkg:VALUE
          EOF_ROOT_EP
          cat >"$site/rootpkg-1.0.dist-info/RECORD" <<EOF_ROOT_RECORD
          rootpkg/__init__.py,,
          rootpkg-1.0.dist-info/METADATA,,
          rootpkg-1.0.dist-info/entry_points.txt,,
          rootpkg-1.0.dist-info/RECORD,,
          EOF_ROOT_RECORD

          cat >"$site/childpkg-2.0.dist-info/METADATA" <<'EOF_CHILD_META'
          Metadata-Version: 2.1
          Name: childpkg
          Version: 2.0
          EOF_CHILD_META
          cat >"$site/childpkg-2.0.dist-info/RECORD" <<EOF_CHILD_RECORD
          childpkg/__init__.py,,
          childpkg-2.0.dist-info/METADATA,,
          childpkg-2.0.dist-info/RECORD,,
          EOF_CHILD_RECORD

          out="$tmp/files.bin"
          PYTHONPATH="$site" python3 scripts/resolve-python-runtime-closure.py             --prefix "$prefix" fakepy >"$out"

          python3 - "$out" "$site" <<'PY_CHECK'
          import pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes().split(b"\0")
          paths = {p.decode() for p in raw if p}
          site = pathlib.Path(sys.argv[2])
          required = {
              str(site / "rootpkg/__init__.py"),
              str(site / "childpkg/__init__.py"),
              str(site / "rootpkg-1.0.dist-info/METADATA"),
              str(site / "childpkg-2.0.dist-info/METADATA"),
          }
          missing = required - paths
          if missing:
              raise SystemExit("recursive Python closure missing: " + ", ".join(sorted(missing)))
          PY_CHECK

      - name: Runtime interpreter closure contract
        shell: bash
        run: |
          set -euo pipefail
          source scripts/dsh-termux-tool-catalog.sh
          CACHE_DIR="$RUNNER_TEMP/dsh-interpreter-contract-cache"
          mkdir -p "$CACHE_DIR"
          copy_link_deps() { :; }
          source scripts/embed-termux-tools.sh

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fake_prefix="$tmp/host/usr"
          stage="$tmp/stage"
          mkdir -p             "$fake_prefix/bin"             "$stage/usr/bin"             "$stage/usr/lib"             "$stage/usr/lib/jvm/java-21-openjdk/bin"             "$stage/usr/libexec/dsh/wrappers"

          # Host alternatives may point to the wrong Java; embedded Runtime
          # must ignore that and expose the staged Java 21 tree directly.
          cat >"$fake_prefix/bin/java" <<'EOF_HOST_JAVA'
          #!/usr/bin/env bash
          echo host-java-17
          EOF_HOST_JAVA
          chmod +x "$fake_prefix/bin/java"

          for cmd in java jar jarsigner keytool javac; do
            cat >"$stage/usr/lib/jvm/java-21-openjdk/bin/$cmd" <<EOF_JAVA21
          #!/usr/bin/env bash
          echo java21-$cmd
          EOF_JAVA21
            chmod +x "$stage/usr/lib/jvm/java-21-openjdk/bin/$cmd"
          done

          cat >"$fake_prefix/bin/perl" <<'EOF_PERL'
          #!/usr/bin/env bash
          echo perl
          EOF_PERL
          chmod +x "$fake_prefix/bin/perl"

          PREFIX="$fake_prefix" dsh_materialize_runtime_interpreters "$stage"

          for cmd in java jar jarsigner keytool javac; do
            test -L "$stage/usr/bin/$cmd"
            test "$(readlink "$stage/usr/bin/$cmd")" = "../lib/jvm/java-21-openjdk/bin/$cmd"
            test "$("$stage/usr/bin/$cmd")" = "java21-$cmd"
          done
          test -x "$stage/usr/bin/perl"

      - name: Validate Android patches against published DSH 0.1.5-rc.2
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm install --prefix "$tmp/lib" --ignore-scripts --no-audit --no-fund --loglevel=error \
            @deepseek-ai/dsh-sandbox-local@0.1.5-rc.2 \
            @deepseek-ai/dsh-subprocess-local@0.1.5-rc.2 \
            @deepseek-ai/dsh-terminal-bash@0.1.5-rc.2
          node scripts/android-runtime-patch.mjs "$tmp"
          sandbox="$(find "$tmp/lib/node_modules" -path '*/@deepseek-ai/dsh-sandbox-local/lib/index.js' -type f -print -quit)"
          subprocess="$(find "$tmp/lib/node_modules" -path '*/@deepseek-ai/dsh-subprocess-local/lib/index.js' -type f -print -quit)"
          terminal="$(find "$tmp/lib/node_modules" -path '*/@deepseek-ai/dsh-terminal-bash/lib/index.js' -type f -print -quit)"
          grep -Fq 'DSH Android compat: partial app-UID sandbox runner' "$sandbox"
          grep -Fq 'DSH Android compat: skip desktop linux-scope' "$subprocess"
          grep -Fq 'DSH Android compat: embedded Bash default' "$terminal"
          node --check "$sandbox"
          node --check "$subprocess"
          node --check "$terminal"

          # Validate the exact published preset payload without asking npm to
          # resolve its open peer ranges against newer rc.3/Cordis releases.
          preset_tgz="$(npm pack @deepseek-ai/dsh-agent-presets@0.1.5-rc.2 --silent --pack-destination "$tmp")"
          preset_root="$tmp/lib/node_modules/@deepseek-ai/dsh-agent-presets"
          mkdir -p "$preset_root"
          tar -xzf "$tmp/$preset_tgz" -C "$preset_root" --strip-components=1
          test -s "$preset_root/presets/standard/agent.cordis.yml"
          node scripts/validate-agent-preset-parity.mjs "$tmp/lib/node_modules"

          workspace="$tmp/workspace"
          mkdir -p "$workspace"
          fake_stage="$tmp/stage"
          mkdir -p "$fake_stage/usr/libexec/dsh" "$fake_stage/usr/bin" "$fake_stage/home/tmp"
          cat >"$fake_stage/usr/libexec/dsh/bash-real" <<'EOF_BASH_REAL'
          #!/usr/bin/env bash
          exec bash "$@"
          EOF_BASH_REAL
          chmod +x "$fake_stage/usr/libexec/dsh/bash-real"
          cat >"$fake_stage/usr/bin/bash" <<'EOF_BASH_WRAPPER'
          #!/usr/bin/env bash
          real="$TERMUX__PREFIX/libexec/dsh/bash-real"
          [ -x "$real" ] || { echo "embedded bash runtime missing: $real" >&2; exit 127; }
          exec "$real" "$@"
          EOF_BASH_WRAPPER
          chmod +x "$fake_stage/usr/bin/bash"

          output="$(env \
            TERMUX__PREFIX="$fake_stage/usr" \
            PREFIX="$fake_stage/usr" \
            HOME="$fake_stage/home" \
            TMPDIR="$fake_stage/home/tmp" \
            bash scripts/dsh-android-sandbox-runner.sh workspace-write "$workspace" -- \
            "$fake_stage/usr/bin/bash" -c 'printf "%s|%s|%s" "$DSH_ANDROID_SANDBOX_MODE" "$DSH_ANDROID_SANDBOX_ENFORCEMENT" "$TERMUX__PREFIX"')"
          test "$output" = "workspace-write|partial|$fake_stage/usr"
          if env TERMUX__PREFIX="$fake_stage/usr" TMPDIR="$fake_stage/home/tmp" bash scripts/dsh-android-sandbox-runner.sh invalid "$workspace" -- true >/dev/null 2>&1; then
            echo "Android sandbox runner accepted an invalid mode" >&2
            exit 1
          fi
      - name: Repository static regression suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-remaining-fixes.sh


  gradle-assemble:
    runs-on: ubuntu-latest
    needs: static-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          sdkmanager_bin="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          [ -x "$sdkmanager_bin" ] || { echo "sdkmanager is unavailable on the runner" >&2; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36"
          test -s "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

      - name: Prepare CI runtime placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          printf 'ci-runtime-placeholder\n' > app/src/main/assets/snapshot.tar.xz

      - name: Resolve Gradle graph
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --console=plain :app:dependencies

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk


  runtime-graph-preflight:
    runs-on: ubuntu-latest
    needs: static-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve exact DSH 0.1.5-rc.2 release family
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/dsh-runtime"
          prefix="$runtime/usr"
          lib="$prefix/lib"
          mkdir -p "$lib" "$runtime/home/.dsh" "$runtime/home/tmp"
          node scripts/dsh-runtime-family.mjs manifest             scripts/dsh-release-family-lock.json 0.1.5-rc.2 11.7.0 > "$lib/package.json"
          (
            cd "$lib"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund               --include=peer --strict-peer-deps=false --loglevel=error               --registry=https://registry.npmjs.org/               --fetch-retries=3 --fetch-retry-mintimeout=10000               --fetch-retry-maxtimeout=60000 --fetch-timeout=180000
          )
          node scripts/dsh-runtime-family.mjs verify-lock             scripts/dsh-release-family-lock.json "$lib/package-lock.json" 0.1.5-rc.2
          (
            cd "$lib"
            npm ci --ignore-scripts --no-audit --no-fund               --include=peer --strict-peer-deps=false --loglevel=error               --registry=https://registry.npmjs.org/               --fetch-retries=3 --fetch-retry-mintimeout=10000               --fetch-retry-maxtimeout=60000 --fetch-timeout=180000
          )
          node scripts/dsh-runtime-family.mjs verify-installed             scripts/dsh-release-family-lock.json "$lib/node_modules" 0.1.5-rc.2

      - name: Validate complete published runtime graph
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/dsh-runtime"
          prefix="$runtime/usr"
          lib="$prefix/lib"
          modules="$lib/node_modules"
          DSH_TARGET_VERSION=0.1.5-rc.2 node scripts/android-runtime-patch.mjs "$prefix"

          while IFS= read -r file; do
            node --check "$file"
          done < <(grep -RIl --include='*.js' 'DSH Android compat:' "$modules/@deepseek-ai" || true)

          node scripts/validate-agent-preset-parity.mjs "$modules"

          dump="$RUNNER_TEMP/dsh-web-default-config.yml"
          env             HOME="$runtime/home"             DSH_HOME="$runtime/home/.dsh"             TMPDIR="$runtime/home/tmp"             node "$modules/@deepseek-ai/dsh/lib/bin.js" web --dump-default-config > "$dump"
          test -s "$dump"
          node scripts/validate-desktop-web-parity.mjs "$dump"

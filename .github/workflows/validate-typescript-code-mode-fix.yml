name: Validate TypeScript code-mode fix

on:
  push:
    branches:
      - fix/typescript-code-mode-syntax

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Static and self tests
        run: |
          set -euo pipefail
          bash -n build-termux.sh
          bash -n scripts/embed-termux-tools.sh
          node --check scripts/android-runtime-patch.mjs
          node scripts/android-runtime-patch.mjs --self-test
          node --check scripts/dsh-mobile-toolbox-mcp.mjs
      - name: Kotlin compile
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

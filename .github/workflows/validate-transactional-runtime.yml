name: Validate transactional runtime repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-transactional-runtime.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Static checks
        run: |
          set -euo pipefail
          bash -n build-termux.sh
          bash -n scripts/embed-termux-tools.sh
          bash scripts/check-severe-fixes.sh
          bash scripts/check-high-fixes.sh
          bash scripts/check-remaining-fixes.sh
          bash scripts/check-koffi-prebuild-fix.sh
          bash scripts/check-fs-search-fix.sh
      - name: Kotlin compile
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon


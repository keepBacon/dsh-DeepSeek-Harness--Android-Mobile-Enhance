name: Validate persistence and Skill ZIP fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-persistence-skill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-severe-fixes.sh
          bash scripts/check-high-fixes.sh
          bash scripts/check-remaining-fixes.sh
          bash scripts/check-koffi-prebuild-fix.sh
          bash scripts/check-fs-search-fix.sh
      - name: Kotlin compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

# rerun: trailing-lambda-compat

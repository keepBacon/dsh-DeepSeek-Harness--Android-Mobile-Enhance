name: Validate Termux tool contracts

on:
  push:
    branches:
      - fix/termux-tool-contracts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n build-termux.sh
          bash -n scripts/embed-termux-tools.sh
      - name: Contract assertions
        run: |
          set -euo pipefail
          grep -Fq 'openssl openssl-tool' build-termux.sh
          grep -Fq 'validate_staged_termux_payload_contract' scripts/embed-termux-tools.sh
          grep -Fq 'require_exact_tool openssl openssl-tool' scripts/embed-termux-tools.sh
          grep -Fq 'pkg install -y "${missing_roots[@]}"' scripts/embed-termux-tools.sh

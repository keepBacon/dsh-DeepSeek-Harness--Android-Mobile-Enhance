name: Build DSH on GitHub (Android ARM64, no Termux)
on:
  push:
    branches: [main] # Upgrade branch builds require workflow_dispatch
    paths:
      - '.github/workflows/build-arm64-dsh.yml'
      - 'scripts/ci-assemble-github-runtime.py'
      - 'scripts/ci_termux_abi.py'
      - 'scripts/test-ci-termux-abi.py'
      - 'scripts/test-android-git-gh-runtime.py'
      - 'scripts/test-android-search-tools.py'
      - 'scripts/test-android-compiler-qemu-runtime.py'
      - 'scripts/ci_fix_web_fetch_limits.py'
      - 'scripts/ci_modsearch_recovery.py'
      - 'scripts/dsh-mobile-toolbox-mcp.mjs'
      - 'scripts/dsh-inspector-tools.mjs'
      - 'scripts/dsh-project-language.mjs'
      - 'scripts/dsh-project-index.mjs'
      - 'scripts/dsh-workspace-lsp.mjs'
      - 'scripts/dsh-workspace-files.mjs'
      - 'scripts/dsh-project-build.mjs'
      - 'scripts/dsh-dev-plan.mjs'
      - 'scripts/test-dsh-dev-plan.mjs'
      - 'scripts/test-dsh-workspace-files.mjs'
      - 'scripts/test-dsh-project-build.mjs'
      - 'scripts/test-dsh-workspace-edit-verify.mjs'
      - 'scripts/test-dsh-workspace-lsp.mjs'
      - 'scripts/test-dsh-project-index.mjs'
      - 'scripts/test-dsh-inspector-tools.mjs'
      - 'scripts/dsh-bounded-spawn.mjs'
      - 'scripts/dsh-dev-process.mjs'
      - 'scripts/dsh-dev-tasks.mjs'
      - 'scripts/test-dsh-dev-process.mjs'
      - 'scripts/test-dsh-dev-tasks.mjs'
      - 'scripts/dsh-android-exec.sh'
      - 'scripts/dsh-android-bash-env.sh'
      - 'scripts/dsh-android-sandbox-runner.sh'
      - 'scripts/embed-termux-tools.sh'
      - 'scripts/android-runtime-patch.mjs'
      - 'scripts/dsh-web-page-reader.mjs'
      - 'scripts/dsh-basic-toolbox-mcp.mjs'
      - 'scripts/dsh-code-engine*.mjs'
      - 'scripts/dsh-lua*.mjs'
      - 'scripts/test-android-mcp-wire.mjs'
      - 'scripts/ci-restore-legacy-keystore.py'
      - 'scripts/ci-verify-current-apk.py'
      - 'scripts/ci-package-signed-apk.py'
      # Build the actual APK after Android UI / WebView / data-layer changes,
      # not only when the build scripts themselves change.
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
      - 'scripts/ci-validate-runtime.py'
      - 'scripts/ci-verify-current-apk.py'
      - 'scripts/test_dsh_runtime_provenance.py'
      - 'scripts/dsh-release-family-lock.json'
      - 'scripts/ci-generate-dsh-family.py'
      - 'scripts/ci-upgrade-dsh-runtime.py'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after building
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  signing-key-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original keystore Secret before expensive native build
        shell: bash
        env:
          DSH_LEGACY_DEBUG_KEYSTORE_B64: ${{ secrets.DSH_LEGACY_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          python3 scripts/ci-restore-legacy-keystore.py --self-test --expected-sha256 0dfb924793215056c19d413987c9858b8aa9d90604ffb18d60cfd75be0697792
          python3 scripts/ci-restore-legacy-keystore.py --check-only --expected-sha256 0dfb924793215056c19d413987c9858b8aa9d90604ffb18d60cfd75be0697792
  native-runtime:
    needs: signing-key-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify packaged MCP ESM import closure
        run: |
          python3 scripts/validate-ci-mobile-esm-closure.py
          python3 scripts/test-ci-termux-abi.py
          python3 scripts/test-upgrade-android-addons.py
          python3 scripts/test-android-compiler-qemu-runtime.py
      - name: Build Android ARM64 runtime on GitHub runner (no Termux)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 dpkg-dev xz-utils
          node --version
          npm --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(2)'
          mkdir -p "$RUNNER_TEMP/dsh-seed" app/src/main/assets
          gh release download "1" -R "$GITHUB_REPOSITORY" -p "Dsh.Mobile.Pro.V0.1.apk" -D "$RUNNER_TEMP/dsh-seed"
          unzip -p "$RUNNER_TEMP/dsh-seed/Dsh.Mobile.Pro.V0.1.apk" assets/snapshot.tar.xz > "$RUNNER_TEMP/dsh-seed/seed.tar.xz"
          python3 scripts/ci-assemble-github-runtime.py \
            --repo . \
            --seed "$RUNNER_TEMP/dsh-seed/seed.tar.xz" \
            --output app/src/main/assets/snapshot.tar.xz \
            --audit runtime-build-audit.json
      - name: Validate ARM64 runtime (no placeholder)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-validate-runtime.py --snapshot app/src/main/assets/snapshot.tar.xz --lock runtime-release-family.json --output runtime-audit.json --expected-version 0.2.2-rc.5 --expected-commit 9c2670d3bce5275e0d1610272958121af87787bb
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-arm64-runtime-${{ github.run_number }}
          path: |
            app/src/main/assets/snapshot.tar.xz
            runtime-audit.json
            runtime-build-audit.json
            runtime-release-family.json
          if-no-files-found: error
          retention-days: 7
  assemble-legacy-signed:
    needs: native-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: dsh-android-arm64-runtime-${{ github.run_number }}
          path: .
      - name: Verify runtime and write provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-validate-runtime.py --snapshot app/src/main/assets/snapshot.tar.xz --lock runtime-release-family.json --output runtime-audit.json --expected-version 0.2.2-rc.5 --expected-commit 9c2670d3bce5275e0d1610272958121af87787bb
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('runtime-audit.json').read_text())
          pathlib.Path('app/src/main/assets/runtime-version.txt').write_text('app=0.1.2\ndsh='+d['dsh_version']+'\nsha256='+d['runtime_sha256']+'\n')
          PY
      - name: Restore original DSH signing key (validated and never logged)
        shell: bash
        env:
          DSH_LEGACY_DEBUG_KEYSTORE_B64: ${{ secrets.DSH_LEGACY_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          python3 scripts/ci-restore-legacy-keystore.py --expected-sha256 0dfb924793215056c19d413987c9858b8aa9d90604ffb18d60cfd75be0697792
      - name: Build signed upgrade APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug -PdshUpgradeVersionCode=45
      - name: Explicitly sign APK with verified original key
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$tools/apksigner" sign --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android --out "$RUNNER_TEMP/original-signed.apk" "$apk"
          mv "$RUNNER_TEMP/original-signed.apk" "$apk"
      - name: Verify signed APK, package ID, version and Runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-verify-current-apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --snapshot app/src/main/assets/snapshot.tar.xz \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --version-code 45 \
            --family-lock runtime-release-family.json \
            --expected-dsh-version 0.2.2-rc.5
      - name: Create and verify direct APK / distribution ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-package-signed-apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output dist \
            --basename DSH-ARM64-Signed-Upgrade-${{ github.run_number }}
          ( cd dist && sha256sum -c SHA256SUMS.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-ARM64-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-ARM64-ZIP-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  # Download and release only the directly installable APK; transferring the
  # extra 680MB ZIP doubles the chance of network failure on mobile downloads.
  # ZIP is still retained independently as an Actions artifact.
  publish-direct-release:
    needs: assemble-legacy-signed
    # Publish verified signed APKs on the branch that actually triggers
    # automatic builds; manual dispatch can opt out of Release publishing.
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DSH-ARM64-APK-${{ github.run_number }}
          path: dist
      - name: Verify retrieved signed APK and its SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          apks = list(Path('dist').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('expected exactly one signed APK artifact')
          apk = apks[0]
          lines = Path('dist/SHA256SUMS.txt').read_text().splitlines()
          matching = [line.split('  ', 1)[0] for line in lines
                      if line.endswith('  ' + apk.name)]
          if len(matching) != 1 or len(matching[0]) != 64:
              raise SystemExit('missing or ambiguous signed APK SHA256 entry')
          actual = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          if actual != matching[0]:
              raise SystemExit('signed APK checksum mismatch before Release upload')
          print('Direct signed APK verified:', apk.name, actual)
          PY
      - name: Publish verified direct-download files with retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dsh-android-0.2.2-rc.5-build-${{ github.run_number }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "DSH Android signed upgrade #${{ github.run_number }}" --notes "Verified direct-install ARM64 APK and SHA256; ZIP remains available as a GitHub Actions artifact. Back up user data before installing."
          fi
          for attempt in 1 2 3 4; do
            if gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"; then
              asset="$(basename dist/*.apk)"
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
                gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url
                exit 0
              fi
            fi
            echo "Release upload failed (${attempt}/4); retrying..." >&2
            sleep $((attempt * 12))
          done
          echo "APK artifacts remain available. Rerun only publish-direct-release." >&2
          exit 1

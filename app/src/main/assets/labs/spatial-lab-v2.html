<!DOCTYPE html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D V2</title><style>body{font:14px sans-serif;background:#111a2a;color:white;margin:12px}canvas{width:100%;max-width:960px;border:1px solid #586c85}button,input,select{padding:8px;margin:3px;background:#314563;color:white;border:1px solid #7a8ba3}textarea,pre{width:97%;height:240px;overflow:auto;background:#152235;color:#b4e5ff;padding:8px}.cols{display:grid;grid-template-columns:3fr 2fr;gap:12px}@media(max-width:800px){.cols{grid-template-columns:1fr}}</style><h2>DSH 3D 空间测试 V2</h2><p>坐标 +X 右，+Y 上，+Z 前；Yaw 0 指向 +Z，Yaw 90 指向 +X。点击画面调整准心。</p><div class="cols"><section><canvas id="canvas" width="960" height="600"></canvas><div><button id="reset">重置</button><button id="forward">前进</button><button id="back">后退</button><button id="left">左移</button><button id="right">右移</button><button id="turnL">左转</button><button id="turnR">右转</button></div><div><label>相机模式<select id="cameraMode"><option value="follow">跟随</option><option value="free">自由</option></select></label><button id="camL">相机左转</button><button id="camR">相机右转</button><button id="camF">相机前进</button></div><div><label>选择目标<select id="target"></select></label><button id="aim">瞄准</button></div><p id="status"></p></section><section><h3>场景 JSON</h3><textarea id="source"></textarea><button id="apply">应用 JSON（兼容 V1）</button><button id="save">导出观察数据</button><h3>模型观察 JSON</h3><pre id="output"></pre></section></div><script src="spatial-core.js"></script><script src="spatial-v2.js"></script><script>
(()=>{'use strict';const S=DshSpatialV2,B=DshSpatial,c=document.querySelector('#canvas'),ctx=c.getContext('2d'),src=document.querySelector('#source'),out=document.querySelector('#output'),status=document.querySelector('#status');let scene=S.defaultScene(),obs,path=[];
function dot(p){return S.project(p,scene.camera,scene.viewport)}
function line(a,b,color){const x=dot(a),y=dot(b);if(!x||!y)return;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x.pixels.x,x.pixels.y);ctx.lineTo(y.pixels.x,y.pixels.y);ctx.stroke()}
function draw(){ctx.fillStyle='#101b2c';ctx.fillRect(0,0,960,600);for(let i=-20;i<=20;i+=2){line(B.V(i,0,-20),B.V(i,0,30),'#354860');line(B.V(-20,0,i+10),B.V(20,0,i+10),'#354860')}for(let i=1;i<path.length;i++)line(path[i-1],path[i],'#ff8bd2');
for(const p of [...obs.bodyParts.map(o=>({...o,color:'#65bcff'})),...obs.objects.map(o=>({...o,color:o.kind==='item'?'#ffd070':'#6be0af'}))]){const point=p.screen;if(!point||!point.inViewport)continue;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(point.pixels.x,point.pixels.y,Math.max(3,Math.min(12,80/point.depth)),0,Math.PI*2);ctx.fill();ctx.font='14px sans-serif';ctx.fillText(p.id+(p.visibility==='occluded'?' [遮挡]':''),point.pixels.x+10,point.pixels.y-5)}
const a=obs.reticle.pixels;ctx.strokeStyle='#f98ddd';ctx.beginPath();ctx.moveTo(a.x-12,a.y);ctx.lineTo(a.x+12,a.y);ctx.moveTo(a.x,a.y-12);ctx.lineTo(a.x,a.y+12);ctx.stroke()}
function refresh(){scene=S.normalize(scene);obs=S.observe(scene);src.value=JSON.stringify(scene,null,2);out.textContent=JSON.stringify(obs,null,2);status.textContent='玩家 '+JSON.stringify(obs.player.position)+' 相机 '+JSON.stringify(obs.camera.position)+' 射线 '+(obs.reticle.worldHit?.id||'无');document.querySelector('#cameraMode').value=scene.camera.follow?'follow':'free';const t=document.querySelector('#target'),v=t.value;t.replaceChildren();for(const p of [...obs.bodyParts.map(x=>({kind:'body',id:x.id})),...obs.objects]){const o=document.createElement('option');o.value=p.kind+':'+p.id;o.textContent=o.value;t.append(o)}if([...t.options].some(o=>o.value===v))t.value=v;draw()}
function attach(id,fn){document.querySelector('#'+id).onclick=()=>{try{fn();refresh()}catch(e){status.textContent='错误：'+e.message}}}function advance(a){const q=S.step(scene,a);scene=q.scene;path=q.motion.path}
attach('reset',()=>{scene=S.defaultScene();path=[]});for(const [id,action] of Object.entries({forward:{forward:1},back:{forward:-1},left:{strafe:-1},right:{strafe:1}}))attach(id,()=>advance({...action,seconds:.25}));attach('turnL',()=>advance({seconds:0,yawDelta:-15}));attach('turnR',()=>advance({seconds:0,yawDelta:15}));for(const [id,action] of Object.entries({camL:{cameraYawDelta:-15},camR:{cameraYawDelta:15},camF:{cameraForward:1}}))attach(id,()=>advance({...action,seconds:id==='camF'?.25:0}));document.querySelector('#cameraMode').onchange=e=>{scene.camera.follow=e.target.value==='follow';refresh()};attach('aim',()=>{const [kind,...name]=document.querySelector('#target').value.split(':');scene=S.aimAt(scene,kind,name.join(':'))});attach('apply',()=>{if(src.value.length>180000)throw Error('JSON too large');scene=S.normalize(JSON.parse(src.value));path=[]});attach('save',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(obs,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='spatial-v2-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});c.onclick=e=>{const r=c.getBoundingClientRect();scene.reticle.normalized.x=Math.max(-1,Math.min(1,2*(e.clientX-r.left)/r.width-1));scene.reticle.normalized.y=Math.max(-1,Math.min(1,1-2*(e.clientY-r.top)/r.height));refresh()};refresh()})();
</script></html>

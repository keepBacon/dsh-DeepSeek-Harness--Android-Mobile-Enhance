<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 3D V4</title><style>body{background:#111b2a;color:#eaf1ff;font:14px system-ui;margin:12px}canvas{width:100%;max-width:960px;border:1px solid #58708b}button,input,select{margin:4px;padding:9px;background:#304d6a;color:white;border:1px solid #738ca4;border-radius:6px}textarea,pre{width:96%;background:#0e1c2d;color:#c7e8ff;overflow:auto;padding:9px}textarea{height:220px}pre{max-height:260px;white-space:pre-wrap}.cols{display:grid;grid-template-columns:3fr 2fr;gap:12px}@media(max-width:800px){.cols{grid-template-columns:1fr}}</style><h2>DSH 3D V4 · 多实体 / 导航 / 回放</h2><p>仅模拟场景：右手坐标系 +X 右、+Y 上、+Z 前。路径是 XZ 平面避障近似，不连接真实游戏。</p><div class="cols"><section><canvas width="960" height="600" id="view"></canvas><div><button id="reset">重置</button><button id="forward">前进 0.25s</button><button id="back">后退</button><button id="left">左移</button><button id="right">右移</button><button id="turn">右转15°</button></div><div><label>目标 X<input type="number" id="goalX" value="8" step="1"></label><label>Z<input type="number" id="goalZ" value="12" step="1"></label><button id="plan">规划路径</button><button id="cancelPlan">取消寻路</button><button id="packet">模型简报</button><button id="replay">5步回放</button></div><p id="status"></p><pre id="report"></pre></section><section><h3>V4 场景 JSON</h3><textarea id="scene"></textarea><button id="apply">导入场景(V1–V4)</button><button id="export">导出模型观察JSON</button><h3>模型观察</h3><pre id="output"></pre></section></div><script src="spatial-core.js"></script><script src="spatial-v2.js"></script><script src="spatial-v3.js"></script><script src="spatial-v4.js"></script><script>
(()=>{'use strict';const S=DshSpatialV4,T=DshSpatialV3,B=DshSpatial,$=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let scene=S.defaultScene(),ob=null,path=[],planJob=null;
function syncViewport(){
  // Keep the displayed camera/reticle projection in the scene's declared
  // viewport, not in the fixed original 960x600 canvas coordinates.
  const vp=scene.viewport;
  const scale=Math.min(1,1280/vp.width,960/vp.height);
  const width=Math.max(1,Math.round(vp.width*scale));
  const height=Math.max(1,Math.round(vp.height*scale));
  if(canvas.width!==width||canvas.height!==height){
    canvas.width=width;canvas.height=height;
  }
  canvas.style.aspectRatio=vp.width+' / '+vp.height;
  ctx.setTransform(width/vp.width,0,0,height/vp.height,0,0);
}
const drawPoint=(p,color,label)=>{const x=T.project(p,scene.camera,scene.viewport);if(!x||!x.inViewport)return;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x.pixels.x,x.pixels.y,6,0,Math.PI*2);ctx.fill();ctx.font='14px sans-serif';ctx.fillText(label,x.pixels.x+10,x.pixels.y-4)};
const line=(a,b,col)=>{const x=T.project(a,scene.camera,scene.viewport),y=T.project(b,scene.camera,scene.viewport);if(!x||!y)return;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(x.pixels.x,x.pixels.y);ctx.lineTo(y.pixels.x,y.pixels.y);ctx.stroke()};
function refresh(){scene=S.normalize(scene);ob=S.observe(scene);syncViewport();$('scene').value=JSON.stringify(scene,null,2);$('output').textContent=JSON.stringify(ob,null,2);$('status').textContent='时间 '+ob.clock+'s / 玩家 '+JSON.stringify(ob.player.position)+' / 动态实体 '+ob.agents.length;ctx.fillStyle='#0d1c30';ctx.fillRect(0,0,scene.viewport.width,scene.viewport.height);for(let i=-20;i<=20;i+=2){line(B.V(i,0,-20),B.V(i,0,30),'#314660');line(B.V(-20,0,i+10),B.V(20,0,i+10),'#314660')}for(let i=1;i<path.length;i++)line(path[i-1],path[i],'#f4a3d5');for(const o of ob.objects)drawPoint(o.world,o.kind==='item'?'#f8c76e':'#72dca5',o.id);for(const a of ob.agents)drawPoint(a.position,'#f58eca',a.id);for(const p of ob.bodyParts)drawPoint(p.world,'#7bc7ff',p.id);const ret=ob.reticle.pixels;ctx.strokeStyle='#ffb2df';ctx.beginPath();ctx.moveTo(ret.x-12,ret.y);ctx.lineTo(ret.x+12,ret.y);ctx.moveTo(ret.x,ret.y-12);ctx.lineTo(ret.x,ret.y+12);ctx.stroke()}
function bind(id,fn){$(id).onclick=()=>{if(planJob){planJob.cancelled=true;planJob=null;}try{fn();refresh()}catch(e){$('status').textContent='错误: '+e.message}}}
function move(a){const x=S.step(scene,{...a,seconds:a.seconds??.25});scene=x.scene;path=x.motion.path;$('report').textContent=JSON.stringify(x.delta,null,2)}
bind('reset',()=>{scene=S.defaultScene();path=[];$('report').textContent=''});for(const [id,a] of Object.entries({forward:{forward:1},back:{forward:-1},left:{strafe:-1},right:{strafe:1}}))bind(id,()=>move(a));bind('turn',()=>move({seconds:0,yawDelta:15}));
$('plan').onclick=async ()=>{
  if(planJob)planJob.cancelled=true;
  const job={cancelled:false};planJob=job;
  $('status').textContent='正在异步规划路径；可随时取消。';
  try{
    const target={x:Number($('goalX').value),z:Number($('goalZ').value)};
    const result=await S.planPathAsync(scene,target,{},progress=>{
      if(planJob===job)$('status').textContent='正在寻路：'+progress.stage+' / 已展开 '+progress.expanded+' 个节点';
    },job);
    if(job!==planJob)return;
    if(result.status==='found')path=result.path;
    $('report').textContent=JSON.stringify(result,null,2);
    refresh();$('status').textContent='寻路结果：'+result.status+'（仅返回已经检查安全的路径）';
  }catch(e){if(job===planJob)$('status').textContent='寻路失败：'+String(e.message).slice(0,200)}
  finally{if(job===planJob)planJob=null}
};
$('cancelPlan').onclick=()=>{if(planJob){planJob.cancelled=true;$('status').textContent='正在取消寻路…'}};
bind('packet',()=>{$('report').textContent=JSON.stringify(S.modelPacket(scene),null,2)});
bind('replay',()=>{const actions=Array.from({length:5},()=>({forward:1,seconds:.25}));const result=S.replay(scene,actions);scene=result.finalScene;path=result.frames.map(f=>f.player);$('report').textContent=JSON.stringify(result.frames,null,2)});
bind('apply',()=>{if($('scene').value.length>180000)throw Error('scene JSON too large');scene=S.normalize(JSON.parse($('scene').value));path=[]});
bind('export',()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(ob,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='dsh-spatial-v4-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
canvas.onclick=e=>{if(planJob){planJob.cancelled=true;planJob=null;}const r=canvas.getBoundingClientRect();scene.reticle.normalized.x=Math.max(-1,Math.min(1,2*(e.clientX-r.left)/r.width-1));scene.reticle.normalized.y=Math.max(-1,Math.min(1,1-2*(e.clientY-r.top)/r.height));refresh()};refresh()})();
</script></html>

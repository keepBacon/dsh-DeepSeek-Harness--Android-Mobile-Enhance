<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 3D 实验室</title><style>body{background:#101827;color:#edf4ff;font:14px system-ui;margin:16px}canvas,textarea,pre{background:#1a2739;color:#edf4ff;border:1px solid #58708c;border-radius:9px}canvas{width:100%;max-width:960px;aspect-ratio:16/10}textarea{width:98%;height:250px}pre{overflow:auto;max-height:500px;padding:12px}button{padding:9px;margin:4px;background:#294463;color:white;border:1px solid #7791ab;border-radius:8px}</style><h2>DSH 3D 空间模拟测试</h2><p>右手系：+X 右、+Y 上、+Z 前；Yaw 0 指向 +Z，Yaw 90 指向 +X；单位米。点击画布移动准心。</p><canvas id="view" width="960" height="600"></canvas><div><button id="reset">重置</button><button id="forward">前进1秒</button><button id="back">后退1秒</button><button id="left">左移1秒</button><button id="right">右移1秒</button><button id="turn">右转15度</button><button id="apply">载入场景JSON</button><button id="download">导出模型观察JSON</button></div><p id="status"></p><h3>场景编辑器（JSON）</h3><textarea id="input" spellcheck="false"></textarea><h3>模型观察（JSON）</h3><pre id="output"></pre><script src="spatial-core.js"></script><script>
(()=>{'use strict';const S=DshSpatial,canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),input=document.getElementById('input'),output=document.getElementById('output'),status=document.getElementById('status');let scene=S.defaultScene(),ob;
function draw(){ctx.fillStyle='#142033';ctx.fillRect(0,0,960,600);const plot=p=>S.projection(p,scene.camera,960,600);function line(a,b){const x=plot(a),y=plot(b);if(!x||!y)return;ctx.beginPath();ctx.moveTo(x.x,x.y);ctx.lineTo(y.x,y.y);ctx.stroke()}ctx.strokeStyle='#324660';for(let i=-20;i<=20;i+=2){line(S.V(i,0,-20),S.V(i,0,40));line(S.V(-20,0,i+10),S.V(20,0,i+10))}
for(const o of [...ob.bodyParts.map(p=>({...p,position:p.world,color:'#68c4ff'})),...ob.objects.map(p=>({...p,position:p.world,color:p.kind==='item'?'#ffd16d':'#80e8b0'}))]){const p=plot(o.position);if(!p)continue;ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(3,Math.min(14,70/p.depth)),0,Math.PI*2);ctx.fill();ctx.font='14px sans-serif';ctx.fillText(o.id,p.x+9,p.y-5)}const r=scene.reticle.normalized,x=480+r.x*480,y=300-r.y*300;ctx.strokeStyle='#ff8fd6';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);ctx.stroke()}
function refresh(){ob=S.observe(scene);input.value=JSON.stringify(scene,null,2);output.textContent=JSON.stringify(ob,null,2);status.textContent='玩家 '+JSON.stringify(ob.player.position)+' · 朝向 '+ob.player.yaw+'° · 准心射线命中 '+(ob.reticle.worldHit?.id||'无');draw()}
function bind(id,fn){document.getElementById(id).onclick=()=>{try{fn();refresh()}catch(e){status.textContent='错误：'+e.message}}}
bind('reset',()=>{scene=S.defaultScene()});for(const [id,act] of Object.entries({forward:{forward:1,seconds:1},back:{forward:-1,seconds:1},left:{strafe:-1,seconds:1},right:{strafe:1,seconds:1},turn:{seconds:0,yawDelta:15}}))bind(id,()=>S.move(scene,act));
bind('apply',()=>{if(input.value.length>150000)throw Error('文件过大');const s=JSON.parse(input.value);S.validate(s);scene=s});
bind('download',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(ob,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='dsh-spatial-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
canvas.onclick=e=>{const r=canvas.getBoundingClientRect();scene.reticle.normalized.x=Math.max(-1,Math.min(1,2*(e.clientX-r.left)/r.width-1));scene.reticle.normalized.y=Math.max(-1,Math.min(1,1-2*(e.clientY-r.top)/r.height));refresh()};refresh()})();
</script></html>

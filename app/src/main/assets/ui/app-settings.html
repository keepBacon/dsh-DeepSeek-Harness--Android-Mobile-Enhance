<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>应用设置 · DSH</title><style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--ink:#17212b;--muted:#8795a2;--border:#e9edf2;--accent:#2875e8;font-family:Inter,"Noto Sans SC","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5;background:#f7f8faed;border-bottom:1px solid #e7ecf1;backdrop-filter:blur(18px)}.bar strong{font-size:17px}.back,.theme{border:0;background:transparent;color:#637386;border-radius:10px;padding:9px}.wrap{max-width:700px;margin:auto;padding:0 18px}.intro{padding:28px 0 24px}.overline{font-size:10px;font-weight:700;letter-spacing:2px;color:#8494a4}.intro h1{font-size:26px;letter-spacing:-.8px;margin:10px 0 7px}.intro p,.caption{font-size:12px;color:#96a2ad;margin:0;line-height:1.7}.health{display:flex;align-items:center;gap:13px;background:linear-gradient(120deg,#fff,#f6faff);padding:17px;border:1px solid #e7edf4;border-radius:20px}.health-ico{display:grid;place-items:center;background:#e8f1ff;border-radius:14px;color:#3975c8;width:44px;height:44px;font-size:22px}.health-main{flex:1;min-width:0}.health-main strong{font-size:13px}.health-main small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.status{font-size:10px;padding:7px 10px;background:#e8f7ef;color:#178852;border-radius:9px;white-space:nowrap}.status.off{background:#eef1f5;color:#83909c}.search{height:46px;margin-top:17px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:8px;color:#9aa6b1}.search input{width:100%;background:transparent;border:0;outline:0;color:var(--ink);font-size:13px}.search input::placeholder{color:#a0aeb9}.tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none;position:sticky;top:64px;margin:0 -18px;padding:13px 18px 10px;background:var(--bg);z-index:4}.tab{white-space:nowrap;border:0;border-radius:9px;background:transparent;color:#8997a5;padding:8px 12px;font-size:12px}.tab.on{background:#e6efff;color:#2870c9;font-weight:650}.section{margin:23px 0 32px;scroll-margin-top:128px}.heading{margin:0 3px 12px;display:flex;gap:10px;align-items:center}.heading h2{margin:0;font-size:15px}.heading p{margin:4px 0 0;font-size:11px;color:#a1acb5}.heading .icon{color:#66829b;font-size:17px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 7px 20px #1b3b5807}.row{min-height:65px;display:flex;align-items:center;gap:13px;padding:13px 15px;border:0;border-bottom:1px solid #f0f2f5;background:transparent;text-align:left;width:100%;color:inherit}.row:last-child{border-bottom:0}.row[role=button]:active{background:#eef5ff}.boxicon{display:grid;place-items:center;width:35px;height:35px;background:#f0f5fa;border-radius:11px;color:#5b86b9;font-size:17px;flex:none}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:13px;font-weight:620}.copy small{display:block;color:#9aa6b2;margin-top:5px;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.arrow{color:#b4bec7}.switch{appearance:none;background:#dbe2eb;width:43px;height:25px;border-radius:22px;position:relative;flex:none;border:0}.switch:before{content:"";position:absolute;width:19px;height:19px;top:3px;left:3px;border-radius:50%;background:white;box-shadow:0 2px 6px #3344;transition:transform .18s}.switch:checked{background:#2f7be6}.switch:checked:before{transform:translateX(18px)}.seg{display:flex;margin:12px 15px 15px;padding:4px;border-radius:12px;background:#f1f4f8;gap:5px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;color:#8190a0;padding:10px 3px;font-size:12px}.seg button.on{background:white;box-shadow:0 2px 7px #2343;color:#2a6cbb;font-weight:650}.tip{margin-top:12px;border-radius:13px;border:1px solid #e1eaf6;background:#edf5ff;color:#6285ac;padding:12px 13px;font-size:11px;line-height:1.7}.tip.muted{border-color:#e7edf3;background:transparent;color:#8996a4}.badge{font-size:10px;background:#f1f4f7;color:#8794a0;padding:6px 8px;border-radius:8px}.footer{text-align:center;color:#afb9c2;font-size:11px;padding:5px 0 32px}.bottom{position:fixed;z-index:10;bottom:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid #e8edf2;backdrop-filter:blur(15px)}#saveState{font-size:11px;color:#97a4b1}.primary{background:#2c78df;color:white;border:0;border-radius:12px;padding:11px 18px;font-size:12px;font-weight:650}.primary:disabled{background:#e9edf2;color:#aeb9c4}#toast{position:fixed;bottom:92px;left:50%;transform:translate(-50%,8px);background:#263847;color:white;font-size:12px;padding:10px 14px;border-radius:11px;z-index:15;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#17232d66;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{background:var(--card);border-radius:20px;padding:22px;width:min(100%,370px)}.modal h3{margin:0}.modal p{color:var(--muted);font-size:12px;line-height:1.8}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.secondary{border:1px solid var(--border);background:transparent;border-radius:10px;padding:10px 14px;color:var(--muted)}.hidden{display:none!important}#empty{display:none;text-align:center;padding:30px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151b22;--card:#202832;--ink:#e4ebf4;--muted:#a4b0bc;--border:#34404b;--accent:#84b7ff}.bar{background:#151b22ed;border-color:#343e49}.health{background:#222d38;border-color:#394854}.health-ico{background:#294361;color:#a4ccff}.status{background:#1f4634;color:#82d8a4}.status.off{background:#343d48;color:#b1becb}.row{border-color:#35414d}.boxicon{background:#313f4d;color:#a6c9ef}.tab.on{background:#2a415a;color:#a6c9ff}.seg{background:#151d26}.seg button.on{background:#35475b;color:#c4e2ff}.tip{background:#253950;color:#bad4f4;border-color:#41536b}.tip.muted{background:transparent;color:#b1becb;border-color:#364353}.bottom{background:#202832ef;border-color:#34404b}.badge{background:#343f4c;color:#b4c1ce}.switch{background:#566577}.switch:checked{background:#4b8de8}.primary:disabled{background:#364250;color:#8492a1}.status.off{background:#303841}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><header class="bar"><button class="back" id="back">‹</button><strong>应用设置</strong><button class="theme" id="topInfo" aria-label="应用信息">ⓘ</button></header><main class="wrap"><div class="intro"><div class="overline">DEEPSEEK HARNESS / MOBILE</div><h1>让一切保持顺手。</h1><p>设备、引擎与工作区，集中管理。</p></div><div class="health"><span class="health-ico">⌁</span><div class="health-main"><strong>DSH 运行状态</strong><small id="engineName">本地运行时</small></div><span id="healthLabel" class="status off">未连接</span></div><label class="search">⌕ <input placeholder="搜索设置或功能…" id="search" autocomplete="off"></label><nav class="tabs" id="tabs"></nav><div id="sections"></div><div id="empty">没有找到相关设置</div><footer class="footer">DeepSeek Harness · Android<br>专注于必要的功能与控制</footer></main></div><footer class="bottom"><span id="saveState">所有设置均已保存</span><button id="apply" class="primary" disabled>应用更改</button></footer><div id="toast" role="status"></div><div id="modal" class="overlay"><div class="modal"><h3 id="modalTitle">确认更改</h3><p id="modalText"></p><div class="modal-actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="confirm">继续</button></div></div></div>
<script>
(()=>{'use strict';
const groups=[
['general','通用','◈','运行方式与扩展管理',[['safe','◈','安全模式','暂停扩展加载，保留所有安装文件与配置'],['plugins','⬡','插件管理','安装、更新与卸载扩展'],['importSkill','↥','导入 Skill','支持 ZIP 和 SKILL.md 文件'],['skills','▤','已安装的 Skill','查看、整理与卸载']]],
['interface','界面','▣','选择适合设备的显示布局',[['mode','▣','显示模式','切换后重新加载 DSH 页面']]],
['workspace','工作区','▱','从设备向当前工作目录导入文件',[['workspace','▤','当前工作区','尚未连接'],['importFiles','↥','导入文件','从手机选择文件，可多选'],['importFolder','▱','批量导入文件和文件夹','复制到当前工作区，不更改工作目录']]],
['tools','工具与 MCP','⌘','连接、协议与执行环境',[['mcp','⌘','MCP 与工具管理','连接、启用状态、协议和逆向工具'],['runtime','⟡','当前运行时','正在读取工具摘要…']]],
['data','数据与诊断','▥','确保状态清晰，数据可追溯',[['dbCheck','↻','数据库完整性检查','检查并更新可重建的元数据索引'],['dbBackup','⇩','创建元数据备份','生成一致性备份，不包含聊天内容'],['sessionDiagnosis','♡','会话恢复诊断','只读检查原始数据位置和链接状态']]],
['labs','实验室','⚛','本地测试与开发工具',[['spatial','⚛','3D 空间模拟','离线场景、碰撞与路径测试'],['luau','⌘','Luau 代码测试','使用设备内真实 Luau CLI']]],
['about','关于','ⓘ','应用信息',[['version','ⓘ','DeepSeek Harness Mobile','Android 移动增强版'],['github','↗','GitHub 仓库','查看项目源码和版本记录']]]
];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),bridge=window.DSHSettings&&typeof window.DSHSettings.state==='function';
const defaults={safeMode:false,interfaceMode:'mobile',workspace:'',mcpSummary:'',engineStatus:'idle',engineName:'本地引擎',version:'0.1.2'};
let initial={...defaults},selected={...defaults},timer;
function message(msg){const x=$('#toast');x.textContent=msg;x.className='show';clearTimeout(timer);timer=setTimeout(()=>x.className='',2500)}
function emit(action,payload){if(!bridge){message('HTML 预览模式 · '+action);return false}try{window.DSHSettings.action(action,JSON.stringify(payload||{}));return true}catch(e){message('操作暂不可用');return false}}
function row(d){let [id,icon,title,desc]=d;let action= !['safe','mode','workspace','runtime','version'].includes(id);let control=id==='safe'?'<input type="checkbox" class="switch" id="safe" aria-label="安全模式">':action?'<span class="arrow">›</span>':id==='version'?'<span class="badge" id="versionText">0.1.2</span>':id==='workspace'?'<span class="badge" id="workspaceBadge">未设置</span>':'';return '<div class="row" '+(action?'data-action="'+id+'" role="button" tabindex="0"':'')+' data-search="'+title+' '+desc+'"><span class="boxicon">'+icon+'</span><div class="copy"><strong>'+title+'</strong><small id="desc-'+id+'">'+desc+'</small></div>'+control+'</div>'+(id==='mode'?'<div class="seg"><button data-mode="mobile">移动端优化</button><button data-mode="native">DSH 原生布局</button></div>':'')}
$('#tabs').innerHTML=groups.map((g,i)=>'<button class="tab '+(i===0?'on':'')+'" data-target="'+g[0]+'">'+g[1]+'</button>').join('');
$('#sections').innerHTML=groups.map(g=>'<section class="section" id="'+g[0]+'"><div class="heading"><span class="icon">'+g[2]+'</span><div><h2>'+g[1]+'</h2><p>'+g[3]+'</p></div></div><div class="card">'+g[4].map(row).join('')+'</div>'+(g[0]==='general'?'<div class="tip">安全模式会暂时停用扩展并重启 DSH，不会删除会话、插件或 Skill 数据。</div>':g[0]==='data'?'<div class="tip muted">数据管理不主动删除聊天、工作区或插件数据。备份仅包含可重建索引。</div>':'')+'</section>').join('');
function dirty(){const yes=selected.safeMode!==initial.safeMode||selected.interfaceMode!==initial.interfaceMode;$('#apply').disabled=!yes;$('#saveState').textContent=yes?'有尚未应用的更改':'所有设置均已保存'}
function render(){$('#safe').checked=selected.safeMode;$$('[data-mode]').forEach(el=>el.classList.toggle('on',selected.interfaceMode===el.dataset.mode));$('#desc-workspace').textContent=initial.workspace||'当前没有可写工作区';$('#workspaceBadge').textContent=initial.workspace?'已连接':'未设置';$('#desc-runtime').textContent=initial.mcpSummary||'暂无运行时摘要';$('#versionText').textContent=initial.version||'0.1.2';$('#engineName').textContent=initial.engineName||'本地运行时';$('#healthLabel').textContent=initial.engineStatus==='running'?'运行中':initial.engineStatus==='error'?'需检查':'未连接';$('#healthLabel').classList.toggle('off',initial.engineStatus!=='running');dirty()}
window.DSHSettingsUI={setState(o){initial={...defaults,...o};initial.safeMode=!!initial.safeMode;selected={...initial};render()},message};
if(bridge){try{window.DSHSettingsUI.setState(JSON.parse(window.DSHSettings.state()))}catch(e){message('状态读取失败')}}else window.DSHSettingsUI.setState({...defaults,workspace:'/storage/emulated/0/Documents/Projects',engineStatus:'running',engineName:'DSH 0.1.5-rc.2 · 本地运行中',mcpSummary:'已发现 107 项工具声明'});
$('#safe').addEventListener('change',e=>{selected.safeMode=e.target.checked;dirty()});
$$('[data-mode]').forEach(el=>el.addEventListener('click',()=>{selected.interfaceMode=el.dataset.mode;render()}));
function closeConfirm(){$('#modal').classList.remove('show')}
function confirm(title,desc,callback){$('#modalTitle').textContent=title;$('#modalText').textContent=desc;$('#modal').classList.add('show');$('#confirm').onclick=()=>{closeConfirm();callback()}}
$('#cancel').onclick=closeConfirm;
$('#apply').onclick=()=>{const submit=()=>{emit('apply',{safeMode:selected.safeMode,interfaceMode:selected.interfaceMode});initial.safeMode=selected.safeMode;initial.interfaceMode=selected.interfaceMode;dirty()};if(initial.safeMode!==selected.safeMode)confirm('安全模式将重启 DSH','会话、插件及 Skill 数据保持不变。',submit);else submit()};
$('#back').onclick=()=>{if(!$('#apply').disabled)confirm('放弃更改？','尚未应用的设置将不会保存。',()=>emit('close'));else emit('close')};
$('#topInfo').onclick=()=>document.getElementById('about').scrollIntoView();
$$('[data-action]').forEach(el=>{const run=()=>emit(el.dataset.action);el.onclick=run;el.onkeydown=e=>{if(e.key==='Enter')run()}});
$$('.tab').forEach(el=>el.onclick=()=>{document.getElementById(el.dataset.target).scrollIntoView({block:'start'});$$('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on')});
$('#search').oninput=e=>{const q=e.target.value.toLowerCase().trim();let found=0;$$('.section').forEach(section=>{let count=0;section.querySelectorAll('.row').forEach(row=>{const visible=!q||(row.dataset.search+' '+row.textContent).toLowerCase().includes(q)||section.querySelector('h2').textContent.toLowerCase().includes(q);row.classList.toggle('hidden',!visible);if(visible)count++});section.classList.toggle('hidden',!count);found+=count});$('#empty').style.display=found?'none':'block';$('#tabs').style.display=q?'none':''};
})();
</script></body></html>
